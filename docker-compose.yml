# AutoPilot FDE — full stack in one command:
#   docker compose up --build
# Dashboard http://localhost:3000 · API http://localhost:8000/docs
#
# Set AUTOPILOT_API_KEY before exposing beyond localhost (see .env.example).

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - autopilot-data:/data
    environment:
      AUTOPILOT_API_KEY: ${AUTOPILOT_API_KEY:-}
      AUTOPILOT_LLM_ENHANCE: ${AUTOPILOT_LLM_ENHANCE:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  autopilot-data:
