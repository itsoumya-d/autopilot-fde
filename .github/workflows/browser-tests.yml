name: Browser regression tests

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'scripts/run_browser_test_backend.py'
      - '.github/workflows/browser-tests.yml'

# A fresh standard public-repository runner tests its OWN checkout. No access
# to an existing cloud/desktop app, secrets, deployment, relay, or paid service.
permissions:
  contents: read

concurrency:
  group: browser-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api
      # One explicitly approved run only; future runs and reruns cannot upload.
      AUTOPILOT_RECORD_DEMO: ${{ github.repository == 'itsoumya-d/autopilot-fde' && github.event.pull_request.number == 8 && github.run_number == 4 && github.run_attempt == 1 && '1' || '0' }}
      AUTOPILOT_BROWSER_CHANNEL: chrome
    steps:
      - name: Check out the candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install backend requirements
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r backend/requirements.txt
      - name: Install locked frontend and test dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Verify preinstalled Chrome and sandboxed launch
        working-directory: frontend
        run: |
          google-chrome --version
          test -x /opt/google/chrome/chrome
          test -r /etc/apparmor.d/chrome
          node <<'JS'
          const { chromium } = require('@playwright/test');
          (async () => {
            const browser = await chromium.launch({ channel: 'chrome', chromiumSandbox: true });
            console.log(`Sandbox-enabled browser launch succeeded: ${browser.version()}`);
            await browser.close();
          })().catch(error => { console.error(error); process.exitCode = 1; });
          JS
      - name: Install official recording encoder for the approved one-shot run
        if: env.AUTOPILOT_RECORD_DEMO == '1'
        working-directory: frontend
        run: npx --no-install playwright install ffmpeg
      - name: Build production frontend
        working-directory: frontend
        run: npm run build
      - name: Run real-browser regression suite
        working-directory: frontend
        run: npm run test:e2e
      - name: Package and enforce exact approved recording size
        if: env.AUTOPILOT_RECORD_DEMO == '1'
        run: python scripts/package_demo_recording.py
      - name: Upload the one approved bounded recording
        if: env.AUTOPILOT_RECORD_DEMO == '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: demo-capture/AutoPilot-recording.zip
          archive: false
          retention-days: 1
          if-no-files-found: error
          overwrite: false
      # No cache, extra artifact, automatic retry, external storage or deployment.
