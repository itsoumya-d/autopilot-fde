name: Browser regression tests

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'scripts/run_browser_test_backend.py'
      - '.github/workflows/browser-tests.yml'

# A fresh standard public-repository runner tests its OWN checkout. No access
# to an existing cloud/desktop app, secrets, deployment, relay, or paid service.
permissions:
  contents: read

concurrency:
  group: browser-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api
      AUTOPILOT_RECORD_DEMO: '0'
    steps:
      - name: Check out the candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install backend requirements
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r backend/requirements.txt
      - name: Install locked frontend and test dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Install official Chromium test dependencies
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: Build production frontend
        working-directory: frontend
        run: npm run build
      - name: Run real-browser regression suite
        working-directory: frontend
        run: npm run test:e2e
      # Deliberately no upload-artifact, cache, external storage, Pages, or
      # deployment step. Reports stay ephemeral. Video recording is disabled.
