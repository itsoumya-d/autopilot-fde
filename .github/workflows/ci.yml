name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov ruff typing_extensions

      - name: Lint (ruff)
        run: ruff check backend/ tests/ scripts/

      - name: Run test suite with coverage gate
        run: PYTHONPATH=. pytest tests/ --ignore=tests/runtime --cov=backend --cov-report=term-missing --cov-fail-under=100

  generated-runtime:
    runs-on: ubuntu-latest
    env:
      # Fail collection if optional dependencies are missing; this job must
      # execute the real runtime regressions, never pass by skipping them.
      AUTOPILOT_REQUIRE_RUNTIME_TESTS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-agents.txt

      - name: Install generated-workflow runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r requirements-agents.txt pytest==9.1.1
          pip check

      - name: Execute generated workflows with real LangGraph and SQLite
        run: PYTHONPATH=. pytest tests/runtime/ -ra

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm run test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
